name: Atualizar Scase Gestor

# A cada 15 minutos, das 6h às 22h (horário de Brasília = 9h às 1h UTC), atualiza os cartões do /gestor.
# Só leitura na Meta e no Google. Cada chamada faz um lote pequeno; repete até não faltar ninguém.
# Usa o mesmo segredo do envio de relatórios (SCASE_CRON_SECRET).
on:
  schedule:
    - cron: "7,22,37,52 9-23 * * *"
    - cron: "7,22,37,52 0,1 * * *"
  workflow_dispatch: {}

concurrency:
  group: gestor-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Atualizar os cartões
        env:
          APP_URL: ${{ vars.REPORTS_APP_URL || 'https://ola-create-something.lovable.app' }}
          CRON_SECRET: ${{ secrets.SCASE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Secret SCASE_CRON_SECRET não configurado."; exit 1; fi
          for i in $(seq 1 40); do
            status=$(curl -sS -o r.json -w "%{http_code}" --max-time 120 -X POST "$APP_URL/api/cron/gestor?limite=4" \
              -H "Authorization: Bearer $CRON_SECRET" || echo 000)
            # Só números no log (o repositório é público): nada de nomes de clientes.
            resumo=$(python3 -c "import json;d=json.load(open('r.json'));print(d.get('feitos'),'feitos,',len(d.get('erros',[])),'erros,',d.get('restantes'),'restantes')" 2>/dev/null || echo "?")
            echo "Rodada $i: HTTP $status · $resumo"
            test "$status" -lt 400 || exit 1
            restantes=$(python3 -c "import json;print(json.load(open('r.json')).get('restantes',0))")
            [ "$restantes" = "0" ] && break
          done
